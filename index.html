<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroWave Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="player-container">
        <div class="player-card">
            <div class="album-art">
                <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=500" id="track-art" alt="Album Art">
                <div class="vinyl-glow"></div>
            </div>

            <div class="track-details">
                <h2 id="track-title">Cyberfunk</h2>
                <h3 id="track-artist">Neon Drive</h3>
            </div>

            <div class="progress-container">
                <span id="current-time" class="time">0:00</span>
                <div class="progress-bar-wrapper" id="progress-wrapper">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <span id="total-duration" class="time">0:00</span>
            </div>

            <div class="controls">
                <button id="prev-btn" class="control-btn"><i class="fas fa-backward"></i></button>
                <button id="play-btn" class="control-btn play-main"><i class="fas fa-play"></i></button>
                <button id="next-btn" class="control-btn"><i class="fas fa-forward"></i></button>
            </div>

            <div class="volume-container">
                <i class="fas fa-volume-down" id="volume-icon"></i>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.7">
            </div>
            
            <div class="playlist-section">
                <div class="playlist-header">
                    <h4><i class="fas fa-list-ul"></i> Next Up</h4>
                </div>
                <div class="playlist-tracks" id="playlist-container">
                    <!-- JavaScript will dynamically inject your 10 songs here -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
